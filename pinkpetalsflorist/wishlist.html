<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wishlist | Pink Petals Florist</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(to bottom, #ffeef4, #ffffff);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #4a4a4a;
    }

    h2 {
      font-weight: 700;
      color: #d6336c;
    }

    .wishlist-card {
      border: none;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(245, 166, 197, 0.25);
      transition: transform 0.2s ease;
    }

    .wishlist-card:hover {
      transform: translateY(-5px);
    }

    .wishlist-card img {
      height: 200px;
      object-fit: cover;
      border-bottom: 1px solid #fce4ec;
    }

    .wishlist-card .card-body {
      padding: 15px;
    }

    .btn-remove {
      background-color: #ffe6ea;
      border: 1px solid #f5a6c5;
      color: #d6336c;
    }

    .btn-remove:hover {
      background-color: #f5a6c5;
      color: white;
    }

    .empty-wishlist {
      padding: 50px 0;
      text-align: center;
      font-size: 1.2rem;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="container py-5">
    <h2 class="text-center mb-4"><i class="bi bi-heart-fill me-2"></i>Wishlist Kamu</h2>
    <div id="wishlist-container" class="row g-4"></div>
  </div>

  <script>
    const wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
    const container = document.getElementById('wishlist-container');

    if (wishlist.length === 0) {
      container.innerHTML = `<div class="empty-wishlist">🌸 Wishlist kamu kosong. Yuk tambahkan produk favoritmu!</div>`;
    } else {
      wishlist.forEach(product => {
        const col = document.createElement('div');
        col.className = 'col-sm-6 col-md-4 col-lg-3';

        col.innerHTML = `
          <div class="card wishlist-card h-100">
            <img src="${product.image}" class="card-img-top" alt="${product.name}">
            <div class="card-body d-flex flex-column">
              <h6 class="card-title text-center">${product.name}</h6>
              <button class="btn btn-remove mt-auto w-100 remove-wishlist" data-id="${product.id}">
                <i class="bi bi-trash me-1"></i>Hapus
              </button>
            </div>
          </div>
        `;
        container.appendChild(col);
      });

      // Tombol hapus dari wishlist
      document.querySelectorAll('.remove-wishlist').forEach(button => {
        button.addEventListener('click', () => {
          const id = button.dataset.id;
          const updated = wishlist.filter(item => item.id !== id);
          localStorage.setItem('wishlist', JSON.stringify(updated));
          location.reload();
        });
      });
    }
  </script>

</body>

</html>
