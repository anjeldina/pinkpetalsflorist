<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Keranjang | Pink Petals Florist</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <style>
    body {
      background-color: #fff0f5;
    }

    #cartItems .card {
      transition: box-shadow 0.3s ease;
    }

    #cartItems .card:hover {
      box-shadow: 0 8px 20px rgba(245, 166, 197, 0.5);
    }

    .card-img-top {
      object-fit: cover;
      height: 200px;
      border-top-left-radius: 0.5rem;
      border-top-right-radius: 0.5rem;
    }

    .card-body {
      display: flex;
      flex-direction: column;
    }

    .btn-delete {
      background-color: #f06292;
      border: none;
      transition: background-color 0.3s ease;
    }

    .btn-delete:hover {
      background-color: #ec407a;
      color: white;
    }

    #cartTotal {
      font-size: 1.5rem;
      color: #d6336c;
      margin-top: 1.5rem;
      border-top: 2px solid #f5a6c5;
      padding-top: 1rem;
    }

    #checkout-btn-container .btn {
      background-color: #d6336c;
      border: none;
      transition: background-color 0.3s ease;
    }

    #checkout-btn-container .btn:hover {
      background-color: #b52b58;
    }

    .qty-btn {
      width: 30px;
      height: 30px;
      border: none;
      background-color: #f5a6c5;
      color: white;
      font-weight: bold;
      border-radius: 50%;
      transition: background-color 0.2s;
    }

    .qty-btn:hover {
      background-color: #d63384;
    }

    /* Responsive tweak */
    @media (max-width: 575.98px) {
      #cartItems .card {
        flex-direction: row;
        height: 120px;
      }

      .card-img-top {
        width: 120px;
        height: 100%;
        border-radius: 0.5rem 0 0 0.5rem;
      }

      .card-body {
        flex: 1;
        padding: 0.75rem 1rem;
      }
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg" style="background-color: #f5a6c5;">
    <div class="container">
      <a class="navbar-brand fw-bold text-white" href="index.html"><i class="bi bi-droplet-half me-2"></i>Pink Petals
        Florist</a>
    </div>
  </nav>

  <!-- Keranjang Section -->
  <section class="py-5">
    <div class="container">
      <h2 class="text-center mb-4">Keranjang Belanja</h2>
      <div id="cartItems" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
      <div id="cartTotal" class="text-end fw-bold"></div>
      <div id="checkout-btn-container" class="d-grid mt-4"></div>
    </div>
  </section>

  <script>
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    const cartContainer = document.getElementById("cartItems");
    const cartTotal = document.getElementById("cartTotal");
    const checkoutBtnContainer = document.getElementById("checkout-btn-container");

    let total = 0;

    if (cart.length === 0) {
      cartContainer.innerHTML = '<p class="text-center fs-5">Keranjang masih kosong.</p>';
      cartTotal.innerText = "";
      checkoutBtnContainer.innerHTML = '<p class="text-center text-muted">Keranjang kosong, tidak bisa checkout.</p>';
    } else {
      cart.forEach((item, index) => {
        const quantity = item.quantity || 1;
        const subtotal = item.price * quantity;
        total += subtotal;

        const card = document.createElement("div");
        card.className = "col";
        card.innerHTML = `
          <div class="card h-100 shadow-sm rounded-4">
            <img src="${item.image || 'placeholder.jpg'}" class="card-img-top" alt="${item.name}" />
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">${item.name}</h5>
              <p class="card-text fw-bold text-danger">Rp${subtotal.toLocaleString("id-ID")}</p>
              <div class="d-flex align-items-center mb-2">
                <button class="qty-btn qty-minus me-2" data-index="${index}">−</button>
                <span class="fw-bold me-2">${quantity}</span>
                <button class="qty-btn qty-plus" data-index="${index}">+</button>
              </div>
              <button class="btn btn-delete btn-sm mt-auto" data-index="${index}">
                <i class="bi bi-trash3 me-1"></i>Hapus
              </button>
            </div>
          </div>
        `;
        cartContainer.appendChild(card);
      });

      cartTotal.innerText = `Total: Rp${total.toLocaleString("id-ID")}`;

      // Tombol checkout
      const checkoutLink = document.createElement("a");
      checkoutLink.className = "btn btn-danger btn-lg rounded-4";
      checkoutLink.textContent = "Lanjut ke Checkout";
      checkoutLink.href = `checkout.html?cart=${encodeURIComponent(JSON.stringify(cart))}`;
      checkoutBtnContainer.appendChild(checkoutLink);

      // Event hapus produk
      document.querySelectorAll(".btn-delete").forEach((btn) => {
        btn.addEventListener("click", function () {
          const index = this.dataset.index;
          cart.splice(index, 1);
          localStorage.setItem("cart", JSON.stringify(cart));
          location.reload();
        });
      });

      // Event tambah jumlah
      document.querySelectorAll(".qty-plus").forEach(btn => {
        btn.addEventListener("click", function () {
          const index = this.dataset.index;
          cart[index].quantity = (cart[index].quantity || 1) + 1;
          localStorage.setItem("cart", JSON.stringify(cart));
          location.reload();
        });
      });

      // Event kurang jumlah
      document.querySelectorAll(".qty-minus").forEach(btn => {
        btn.addEventListener("click", function () {
          const index = this.dataset.index;
          if ((cart[index].quantity || 1) > 1) {
            cart[index].quantity -= 1;
          } else {
            cart.splice(index, 1);
          }
          localStorage.setItem("cart", JSON.stringify(cart));
          location.reload();
        });
      });
    }
  </script>

  <!-- Footer -->
  <footer class="text-white text-center py-4 mt-5" style="background-color: #f5a6c5;">
    <div class="container">
      <p class="mb-1">&copy; 2025 Pink Petals Florist. All rights reserved.</p>
    </div>
  </footer>
</body>

</html>
