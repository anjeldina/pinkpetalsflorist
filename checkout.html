<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout | Pink Petals Florist</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body {
      background-color: #fff0f5;
    }

    .checkout-card,
    .thankyou-card {
      background-color: #ffffff;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      margin: 40px auto;
    }

    .form-label {
      font-weight: bold;
    }

    .thankyou-card {
      text-align: center;
      display: none;
    }

    .thankyou-card h1 {
      color: #d6336c;
      font-weight: bold;
    }

    .thankyou-card p {
      margin-top: 15px;
      font-size: 1.1rem;
    }

    .btn-home {
      margin-top: 30px;
      background-color: #d6336c;
      color: white;
      padding: 10px 25px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      transition: background-color 0.3s ease;
      text-decoration: none;
    }

    .btn-home:hover {
      background-color: #b52b58;
    }
  </style>
</head>

<body>

  <!-- Halaman Checkout -->
  <div class="checkout-card">
    <h2 class="text-center mb-4 text-danger">Checkout Pesanan</h2>

    <!-- Ringkasan Pesanan -->
    <div id="order-summary" class="mb-4"></div>

    <form id="checkout-form">
      <div class="mb-3">
        <label for="nama" class="form-label">Nama Lengkap</label>
        <input type="text" class="form-control" id="nama" placeholder="Masukkan nama lengkap Anda" required />
      </div>

      <div class="mb-3">
        <label for="whatsapp" class="form-label">Nomor WhatsApp</label>
        <input type="tel" class="form-control" id="whatsapp" placeholder="Contoh: 081234567890" required />
      </div>

      <div class="mb-3">
        <label for="alamat" class="form-label">Alamat Pengiriman</label>
        <textarea class="form-control" id="alamat" rows="3" placeholder="Masukkan alamat lengkap tujuan pengiriman"
          required></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Metode Pengiriman</label>
        <select class="form-select" id="metodePengiriman" required>
          <option selected disabled>Pilih metode</option>
          <option value="COD (Bayar di Tempat)">COD (Bayar di Tempat)</option>
          <option value="Kurir Toko">Kurir Toko</option>
          <option value="Ambil di Toko">Ambil di Toko</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Metode Pembayaran</label>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="pembayaran" id="transfer" value="Transfer Bank" required />
          <label class="form-check-label" for="transfer">Transfer Bank</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="pembayaran" id="cod" value="Bayar di Tempat (COD)"
            required />
          <label class="form-check-label" for="cod">Bayar di Tempat (COD)</label>
        </div>
      </div>

      <div class="d-grid mt-4">
        <button type="submit" class="btn btn-danger btn-lg">Pesan Sekarang</button>
      </div>
    </form>
  </div>

  <!-- Halaman Terima Kasih (Tersembunyi Awalnya) -->
  <div id="thankyou-message" class="thankyou-card">
    <h1 class="text-danger">Terima kasih telah berbelanja di Pink Petals!</h1>
    <p>Pesananmu siap kami proses ✨</p>
    <p class="text-muted">Semoga harimu seindah bunga atau gift yang kamu pilih 🌸</p>
    <a href="index.html" class="btn-home">Kembali ke Beranda</a>
  </div>

  <script>
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    const orderSummary = document.getElementById("order-summary");

    if (cart.length === 0) {
      orderSummary.innerHTML = "<p>Keranjang kosong. Silakan kembali ke halaman produk.</p>";
    } else {
      let html = "<h5>Ringkasan Pesanan:</h5><ul class='list-group mb-3'>";
      let total = 0;
      cart.forEach((item) => {
        const qty = item.quantity || 1;
        const subtotal = item.price * qty;
        total += subtotal;
        html += `<li class="list-group-item d-flex justify-content-between align-items-center">
                ${item.name} x ${qty}
                <span>Rp${subtotal.toLocaleString("id-ID")}</span>
              </li>`;
      });
      html += `</ul><h5>Total: Rp${total.toLocaleString("id-ID")}</h5>`;
      orderSummary.innerHTML = html;
    }

    const form = document.getElementById("checkout-form");
    form.addEventListener("submit", function (e) {
      e.preventDefault();

      if (cart.length === 0) {
        Swal.fire({
          icon: 'warning',
          title: 'Keranjang kosong!',
          text: 'Silakan tambahkan produk terlebih dahulu.',
          confirmButtonColor: '#d6336c'
        });
        return;
      }

      localStorage.removeItem("cart");

      // Toast notification di pojok bawah, otomatis hilang
      Swal.fire({
        toast: true,
        position: 'bottom-end',
        icon: 'success',
        title: 'Pesanan selesai!',
        text: 'Terima kasih telah berbelanja 💖',
        showConfirmButton: false,
        timer: 3000,
        timerProgressBar: true,
        background: '#fff0f5',
        color: '#b52b58',
        didClose: () => {
          document.querySelector(".checkout-card").style.display = "none";
          document.getElementById("thankyou-message").style.display = "block";
        }
      });
    });
  </script>

</body>

</html>
